name: Generate Trophy

on:
  schedule:
    - cron: "0 0 * * *"   # regenerates once a day
  workflow_dispatch:        # lets you trigger it manually anytime
  push:
    branches: [main]
    paths: [".github/workflows/trophy.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: alokagarwal565
          output_path: trophy.svg
          theme: tokyonight
          no-frame: "true"
          row: "2"
          column: "4"
          token: ${{ secrets.SNAKE_TOKEN }}

      - name: Commit trophy.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "Update trophy.svg"
          git push
